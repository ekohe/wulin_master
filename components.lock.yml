# Which commit each component is vendored at. Read by `template.rb` at scaffold time.
#
# `ref` is what a generated app actually gets; without it the app receives whatever the branch
# tipped to that day. `branch` is the line the ref is tracked on, and `script/check_components.rb`
# reports when it has moved ahead.
#
# `wulin_master` carries a branch and no ref on purpose: it is this repository, served from the same
# branch as the gem it vendors.
#
# `verified_at` is the last date a real `rails new` was run against these refs end to end. It is a
# record of a run, not a property of the file. `script/check_components.rb --bump` clears it, and
# the check fails until somebody re-runs the recipe below and commits the date with the new refs; a
# change to how components are vendored leaves it just as stale, by hand.
verified_at: "2026-10-19"
verified_by: >-
  A real `rails new` with WULIN_COMPONENTS naming every optional component, against this template:
  each one vendored at the ref below, 33 migrations applied, and each engine's own model resolving
  under RAILS_ENV=test — WulinAuth::User, Privilege, WulinAudit::AuditLog, WulinQueue::Process,
  WulinAgent::Conversation.
verify_with: |-
  WULIN_COMPONENTS=all \
    rails new /tmp/verify --force --quiet --name=verify --skip-hotwire --skip-solid \
    --database=postgresql --skip-javascript --skip-ci --skip-test -m <template.rb>
  cd /tmp/verify && RAILS_ENV=test bin/rails db:prepare && RAILS_ENV=test bin/rails runner \
    'p [WulinAuth::User.count, Privilege.count, WulinAudit::AuditLog.count, WulinQueue::Process.count, WulinAgent::Conversation.count]'
components:
  wulin_master:
    branch: v3
  wulin_auth:
    branch: main
    ref: 680a67e2c209f15ef112dc876d361006dcc97acb
  wulin_permits:
    branch: main
    ref: 4fba2f8f2ec72630d7642e67150c6f00a62c6614
  wulin_queue:
    branch: main
    ref: 3371ac47c0d1282d9a0c1d459fc21d75ffa42707
  wulin_audit:
    branch: main
    ref: 9573ed1111d8076e0028fd477017fa3ab83d9b09
  wulin_excel:
    branch: main
    ref: 7db8650e0458cac71901c2b0faab7d977f3af12d
  wulin_agent:
    branch: v3
    ref: 7493d03dd3ae22cc5a2ae757e2c66f01c0f68b5e
