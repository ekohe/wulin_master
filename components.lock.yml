# Which commit each component is vendored at. Read by `template.rb` at scaffold time.
#
# `ref` is what a generated app actually gets; without it the app receives whatever the branch
# tipped to that day. `branch` is the line the ref is tracked on, and `script/check_components.rb`
# reports when it has moved ahead.
#
# `wulin_master` carries a branch and no ref on purpose: it is this repository, served from the same
# branch as the gem it vendors.
#
# `verified_at` is the last date a real `rails new` was run against these refs end to end. It is a
# record of a run, not a property of the file. `script/check_components.rb --bump` clears it, and
# the check fails until somebody re-runs the recipe below and commits the date with the new refs; a
# change to how components are vendored leaves it just as stale, by hand.
# `ruby` is the Ruby series a new app is created on (wulin-forge reads it). `rails new` pins the patch
# it ran on in the app, so this moves new apps only.
ruby: "4.0"

verified_at: "2026-11-06"
verified_by: >-
  A real `rails new` with WULIN_COMPONENTS naming every optional component, against this template:
  each one vendored at the ref below, 36 migrations applied, and each engine's own model resolving
  under RAILS_ENV=test — WulinAuth::User, Privilege, WulinAudit::AuditLog, WulinQueue::Process,
  WulinAgent::Conversation. `all` leaves out wulin_oauth, so it gets a scaffold of its own in place of
  wulin_auth: 33 migrations, User resolving to wulin_oauth's provider-backed class, and wulin_permits'
  UsersController carrying the gem's invite action. Both on Ruby 3.4.12 and 4.0.9, Rails 8.1.4.1.
verify_with: |-
  WULIN_COMPONENTS=all \
    rails new /tmp/verify --force --quiet --name=verify --skip-hotwire --skip-solid \
    --database=postgresql --skip-javascript --skip-ci --skip-test -m <template.rb>
  cd /tmp/verify && RAILS_ENV=test bin/rails db:prepare && RAILS_ENV=test bin/rails runner \
    'p [WulinAuth::User.count, Privilege.count, WulinAudit::AuditLog.count, WulinQueue::Process.count, WulinAgent::Conversation.count]'
  WULIN_COMPONENTS=wulin_oauth,wulin_audit,wulin_excel,wulin_queue,wulin_agent \
    rails new /tmp/verify_oauth --force --quiet --name=verify_oauth --skip-hotwire --skip-solid \
    --database=postgresql --skip-javascript --skip-ci --skip-test -m <template.rb>
  cd /tmp/verify_oauth && RAILS_ENV=test bin/rails db:prepare && RAILS_ENV=test bin/rails runner \
    'p [User.name, Privilege.count, UsersController.public_method_defined?(:invite)]'
components:
  wulin_master:
    branch: v3
  wulin_auth:
    branch: main
    ref: de6f2f0b5193839441301055e2af223d63d1dd9e
  wulin_oauth:
    branch: v3
    ref: d23946b1a3c3a9d93002468d66ab8e8ec4da2f23
  wulin_permits:
    branch: main
    ref: d35c32f56c2f48b103c953e859f9d0979a2b0284
  wulin_queue:
    branch: main
    ref: b200c19b860656ba1347a07857e7c82e3c9cf575
  wulin_audit:
    branch: main
    ref: 3dbda81adc9ed307ba3ab49e53338a97c9412b6b
  wulin_excel:
    branch: main
    ref: 4d4bf515696196ca11cff0eaa2adbd2b89be701c
  wulin_agent:
    branch: main
    ref: db0c7a6e4673bb0da0047716bdae098073a72368
