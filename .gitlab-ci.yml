image: ruby:2.7.8

services:
  - postgres:latest

variables:
  POSTGRES_DB: wulin_app_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ''
  POSTGRES_HOST_AUTH_METHOD: trust

cache:
  key:
    files:
      - Gemfile.lock
  paths:
    - vendor/bundle

stages:
  - test

before_script:
  - apt-get update -qy
  - apt-get install -qy libfontconfig1

  # JavaScript runtime for ExecJS. Installed from nodejs.org because Debian
  # bullseye is EOL and its security repository no longer serves nodejs.
  - curl -fsSL https://nodejs.org/dist/v20.20.2/node-v20.20.2-linux-x64.tar.xz | tar -xJ -C /usr/local --strip-components=1
  - node --version

  # gems
  - gem install bundler -v 2.4.22
  - cp spec/wulin_app/config/database.ci.yml spec/wulin_app/config/database.yml

  # cache dir
  - mkdir -p vendor/bundle
  - bundle config set path vendor/bundle

  # install gems
  - bundle check || bundle install --jobs 8

assets_precompile:
  stage: test
  script:
    - RAILS_ENV=development bundle exec rake assets:precompile

rspec:
  stage: test
  script:
    - RAILS_ENV=test bundle exec rake db:drop db:create db:migrate
    - RAILS_ENV=test bundle exec rspec spec

ruby_lint:
  stage: test
  script:
    - bundle exec rake standard
