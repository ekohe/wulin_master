image: ruby:3.4.4

services:
  - postgres:latest

variables:
  POSTGRES_DB: wulin_app_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ''
  POSTGRES_HOST_AUTH_METHOD: trust

cache:
  key:
    files:
      - Gemfile.lock
  paths:
    - vendor/bundle

stages:
  - test

before_script:
  - apt-get update -qy
  - apt-get install -qy nodejs
  - apt-get install -qy libfontconfig1

  # gems
  - gem install bundler -v 2.7.2
  - cp spec/wulin_app/config/database.ci.yml spec/wulin_app/config/database.yml

  # cache dir
  - mkdir -p vendor/bundle
  - bundle config set path vendor/bundle

  # install gems
  - bundle check || bundle install --jobs 8

assets_precompile:
  stage: test
  script:
    - RAILS_ENV=development bundle exec rake assets:precompile

rspec:
  stage: test
  script:
    - RAILS_ENV=test bundle exec rake db:drop db:create db:migrate
    - RAILS_ENV=test bundle exec rspec spec

ruby_lint:
  stage: test
  script:
    - bundle exec rake standard

# Will a scaffold still work as pinned? The catalog names a commit per component, so this is not
# asking whether anything moved -- it asks whether the commits it names can still be fetched, which
# is the one way a generated app breaks without anybody here changing a line. A branch that has
# moved ahead is printed as an upgrade available and does not fail the job: taking it is a decision
# with a re-verification attached, not something to be nagged about on every push.
#
# `before_script: []` because this needs git and network and nothing else: no bundle, no database,
# five `ls-remote` calls and five shallow fetches.
components_pins:
  stage: test
  before_script: []
  script:
    - ruby script/check_components.rb
